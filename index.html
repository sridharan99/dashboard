<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Review insights</title>
    <style>
        :root {
            --bg: #f6f7f9;
            --surface: #fff;
            --text: #1d2330;
            --muted: #667085;
            --line: #e3e6ec;
            --accent: #1f5fbf;
            --bad: #c2410c;
            --good: #2f7d4f;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #12151c;
                --surface: #1b2029;
                --text: #e8ebf2;
                --muted: #98a2b3;
                --line: #2b3240;
                --accent: #6ea2f0;
                --bad: #f08a5d;
                --good: #6cc08b;
                color-scheme: dark
            }
        }

        :root[data-theme="dark"] {
            --bg: #12151c;
            --surface: #1b2029;
            --text: #e8ebf2;
            --muted: #98a2b3;
            --line: #2b3240;
            --accent: #6ea2f0;
            --bad: #f08a5d;
            --good: #6cc08b;
            color-scheme: dark
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
        }

        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 20px 16px 40px
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 4px
        }

        h2 {
            font-size: 1.05rem;
            margin: 0 0 12px
        }

        .sub {
            color: var(--muted);
            margin: 0 0 16px;
            font-size: .9rem
        }

        select {
            width: 100%;
            padding: 10px;
            font: inherit;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            margin-bottom: 16px
        }

        select:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px
        }

        .stat b {
            display: block;
            font-size: 1.6rem
        }

        .stat span {
            color: var(--muted);
            font-size: .85rem
        }

        .row {
            display: grid;
            grid-template-columns: 90px 1fr 44px;
            gap: 10px;
            align-items: center;
            margin: 8px 0;
            font-size: .9rem
        }

        .track {
            background: var(--line);
            border-radius: 4px;
            height: 14px;
            overflow: hidden
        }

        .fill {
            height: 100%;
            background: var(--accent)
        }

        .fill.bad {
            background: var(--bad)
        }

        .num {
            text-align: right;
            color: var(--muted)
        }

        .rev {
            border-top: 1px solid var(--line);
            padding: 10px 0
        }

        .rev:first-of-type {
            border-top: 0
        }

        .rev small {
            color: var(--muted)
        }

        .tag {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 99px;
            border: 1px solid var(--line);
            font-size: .78rem;
            margin-left: 6px
        }

        .bad {
            color: var(--bad)
        }

        .good {
            color: var(--good)
        }
    </style>
</head>

<body>
    <main>
        <h1>Review insights</h1>
        <p class="sub">Sample data for four properties. Replace it with real review exports later.</p>
        <label for="prop" class="sub">Property</label>
        <select id="prop"></select>

        <div class="panel stats" id="stats"></div>
        <div class="panel">
            <h2>Average rating by month</h2>
            <div id="months"></div>
        </div>
        <div class="panel">
            <h2>Complaints by theme</h2>
            <div id="themes"></div>
        </div>
        <div class="panel">
            <h2>Needs attention</h2>
            <div id="low"></div>
        </div>
        <div class="panel">
            <h2>Summary</h2>
            <p id="summary" style="margin:0"></p>
        </div>
    </main>
    <script>
        // Sample data: fixed seed so everyone sees the same reviews
        var props = ["Central Sydney", "Surry Hills", "Potts Point", "Darling Harbour"];
        var themes = ["Cleanliness", "Noise", "Staff", "Security", "Location"];
        var texts = {
            Cleanliness: "Bathroom was not clean and the room smelled.",
            Noise: "Hard to sleep, noisy shared space at night.",
            Staff: "Nobody on site and no help when I needed it.",
            Security: "Did not feel safe, lockers were hard to use.",
            Location: "Good spot, but far from the station."
        };
        var good = ["Great location and the free dinner was a bonus.", "Clean pod, comfy bed, easy check-in.", "Quiet and good value for money."];
        var seed = 42; function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296 }
        var data = [];
        props.forEach(function (p, pi) {
            for (var i = 0; i < 50; i++) {
                var m = Math.floor(rnd() * 6); // Jun..Nov
                var base = 7.6 - pi * 0.4; // each property differs a little
                var r = Math.max(2, Math.min(10, Math.round(base + (rnd() - 0.5) * 5)));
                var th = null, tx;
                if (r <= 6) { th = themes[Math.floor(rnd() * themes.length)]; tx = texts[th] }
                else tx = good[Math.floor(rnd() * good.length)];
                data.push({ p: p, m: m, r: r, th: th, tx: tx, d: "2026-" + String(6 + m).padStart(2, "0") + "-" + String(1 + Math.floor(rnd() * 27)).padStart(2, "0") });
            }
        });
        var mn = ["Jun", "Jul", "Aug", "Sep", "Oct", "Nov"];
        var sel = document.getElementById("prop");
        sel.innerHTML = '<option value="all">All properties</option>' + props.map(function (p) { return '<option>' + p + '</option>' }).join("");
        function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c] }) }
        function avg(a) { return a.length ? a.reduce(function (s, x) { return s + x.r }, 0) / a.length : 0 }
        function render() {
            var v = sel.value;
            var rows = data.filter(function (x) { return v === "all" || x.p === v });
            var neg = rows.filter(function (x) { return x.r <= 6 });
            document.getElementById("stats").innerHTML =
                '<div class="stat"><b>' + avg(rows).toFixed(1) + '</b><span>Average rating</span></div>' +
                '<div class="stat"><b>' + rows.length + '</b><span>Reviews</span></div>' +
                '<div class="stat"><b class="bad">' + Math.round(neg.length / rows.length * 100) + '%</b><span>Rated 6 or less</span></div>';
            var mh = "", ma = [];
            mn.forEach(function (name, i) {
                var s = rows.filter(function (x) { return x.m === i }); var a = avg(s); ma.push(a);
                mh += '<div class="row"><span>' + name + '</span><div class="track"><div class="fill" style="width:' + a * 10 + '%"></div></div><span class="num">' + a.toFixed(1) + '</span></div>';
            });
            document.getElementById("months").innerHTML = mh;
            var counts = themes.map(function (t) { return { t: t, n: neg.filter(function (x) { return x.th === t }).length } }).sort(function (a, b) { return b.n - a.n });
            var max = Math.max(1, counts[0].n);
            document.getElementById("themes").innerHTML = counts.map(function (c) {
                return '<div class="row"><span>' + c.t + '</span><div class="track"><div class="fill bad" style="width:' + c.n / max * 100 + '%"></div></div><span class="num">' + c.n + '</span></div>'
            }).join("");
            var low = rows.filter(function (x) { return x.r <= 5 }).sort(function (a, b) { return a.d < b.d ? 1 : -1 }).slice(0, 5);
            document.getElementById("low").innerHTML = low.length ? low.map(function (x) {
                return '<div class="rev"><b class="bad">' + x.r + '/10</b><span class="tag">' + esc(x.th) + '</span><br>' + esc(x.tx) + '<br><small>' + esc(x.p) + ' · ' + x.d + '</small></div>'
            }).join("") : '<p class="sub">No low-rated reviews. Nothing to act on.</p>';
            var delta = ma[5] - ma[4];
            document.getElementById("summary").textContent =
                (v === "all" ? "Across all properties" : v) + ", the top complaint is " + counts[0].t.toLowerCase() + " (" + counts[0].n + " reviews). Average rating moved " + (delta >= 0 ? "up " : "down ") + Math.abs(delta).toFixed(1) + " points from October to November.";
        }
        sel.addEventListener("change", render); render();
    </script>
</body>

</html>
